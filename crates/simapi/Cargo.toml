[package]
name = "simapi"
description = "A Rust wrapper for the SimAPI C library, providing safe and ergonomic access to its functionality."
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
serde = ["dep:serde", "dep:serde_arrays"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_arrays = { version = "0.2", optional = true }
simapi-sys = { path = "../simapi-sys" }
thiserror = "2.0"

[dev-dependencies]
ctrlc = "3.5"
simapi = { path = "." }

[[example]]
name = "read_telemetry"
path = "examples/read_telemetry.rs"
